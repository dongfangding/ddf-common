name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile
        run: mvn -q -DskipTests compile

      - name: Governance starter smoke test
        run: mvn -q -pl ddf-common-governance-starter -Dtest=GovernanceAutoConfigurationTest test

      - name: Data mysql starter smoke test
        run: mvn -q -pl ddf-common-data-mysql-starter -Dtest=DataMysqlAutoConfigurationTest test
