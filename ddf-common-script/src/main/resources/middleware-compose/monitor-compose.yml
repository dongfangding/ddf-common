networks:
  middleware-network:
    external: true  # 使用已创建的外部网络

services:
  otelcol:
    image: otel/opentelemetry-collector-contrib:0.148.0
    container_name: otelcol
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    networks:
      - middleware-network
    volumes:
      - ./monitor/otelcol/otelcol-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otelcol_data:/var/lib/otelcol/file_storage
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "13133:13133" # health check
      - "8888:8888"   # collector internal metrics
    depends_on:
      - jaeger
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:13133/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 1536m
    cpus: 1.5
  jaeger:
    image: jaegertracing/jaeger:2.16.0
    container_name: jaeger
    restart: unless-stopped
    networks:
      - middleware-network
    ports:
      - "16686:16686" # Jaeger UI
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:16686/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
 #     - --web.enable-lifecycle
      - --web.enable-otlp-receiver
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitor/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - middleware-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: monitor.example.com
      GF_SERVER_ROOT_URL: https://monitor.example.com/
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitor/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger
    networks:
      - middleware-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep ok >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node_exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - middleware-network

# nginx使用中间件里的nginx, 只是多配置一个监听，见nginx/conf.d/monitor.conf

volumes:
  otelcol_data:
  prometheus_data:
  grafana_data:
