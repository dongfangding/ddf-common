networks:
  middleware-network:
    external: true  # 使用已创建的外部网络

services:
  mysql:
    image: mysql:8.0.32
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # 显式指定时区，防止 Java 应用读取时间不一致
      TZ: Asia/Shanghai
    # 兼容老版本的mysql客户端，因mysql8以上版本的密码规则导致无法连接
    # command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./mysql/data:/var/lib/mysql
      - ./mysql/logs:/var/log/mysql
      # 挂载到conf.d下，避免文件权限导致配置不生效
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # 优化：避免在进程列表中泄露密码，利用内置 ping 命令
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - middleware-network

  redis:
    image: redis:6.0.17
    container_name: redis
    restart: always
    command: [ "redis-server", "/data/redis.conf" ]
    ports:
      - "6379:6379"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./redis:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - middleware-network

  zookeeper:
    image: zookeeper:3.6.4
    container_name: zookeeper
    restart: always
    ports:
      - "2181:2181"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./zookeeper/conf:/conf
      - ./zookeeper/data:/data
      - ./zookeeper/datalog:/datalog
    healthcheck:
      test: [ "CMD-SHELL", "zkServer.sh status || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - middleware-network
  mongo:
    # 虚拟机器需要在设置 → 系统 → 处理器 → 勾选 "启用 VT-x/AMD-V"
    image: mongo:6.0.4
    container_name: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./mongo/configdb:/data/configdb
      - ./mongo/db:/data/db
    command: [ "mongod", "--config", "/data/configdb/mongod.conf" ]
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --eval \"db.adminCommand('ping')\"" ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - middleware-network

  elasticsearch:
    image: elasticsearch:7.17.9
    container_name: es
    restart: always
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # 启动可能会报错，java.nio.file.AccessDeniedException: /usr/share/elasticsearch/data/nodes
      # 手动执行下权限，es镜像内部以elasticsearch用户， uid通常为1000运行，所以可以在宿主机执行，给挂载目录权限。sudo chown -R 1000:1000 ./elasticsearch/data
      - ./elasticsearch/data:/usr/share/elasticsearch/data
      - ./elasticsearch/logs:/usr/share/elasticsearch/logs
      - ./elasticsearch/config:/usr/share/elasticsearch/config
    networks:
      - middleware-network

  rocketmq-namesrv:
    image: rocketmqinc/rocketmq-namesrv:4.5.0-alpine
    container_name: rocketmq-namesrv
    restart: always
    ports:
      - "9876:9876"
    environment:
      MAX_HEAP_SIZE: 512M
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./rocketmq/namesrv/logs:/root/logs
      - ./rocketmq/namesrv/store:/root/store
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9876" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - middleware-network

  rocketmq-broker:
    image: rocketmqinc/rocketmq-broker:4.5.0-alpine
    container_name: rocketmq-broker
    restart: always
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    environment:
      MAX_HEAP_SIZE: 512M
      NAMESRV_ADDR: rocketmq-namesrv:9876
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./rocketmq/broker/logs:/root/logs
      - ./rocketmq/broker/store:/root/store
      - ./rocketmq/broker/conf:/root/rocketmq-4.5.0/conf
    command: [ "sh", "mqbroker", "-c", "/root/rocketmq-4.5.0/conf/broker.conf" ]
    networks:
      - middleware-network

  rocketmq-console:
    image: styletang/rocketmq-console-ng
    container_name: rocketmq-console
    restart: always
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    ports:
      - "8804:8080"
    environment:
      JAVA_OPTS: "-Xms256M -Xmx512M -Dlogging.level.root=info -Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false"
    networks:
      - middleware-network

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.3.1
    container_name: xxl-job-admin
    restart: always
    ports:
      - "8808:8080"
    volumes:
      - ./xxl-job:/data/applogs
    environment:
      JAVA_OPTS: "-Xms256M -Xmx512M"
      PARAMS: "--spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai --spring.datasource.username=root --spring.datasource.password=${MYSQL_ROOT_PASSWORD} --xxl.job.accessToken=${XXL_JOB_TOKEN}"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - middleware-network

  emqx1:
    # 企业版需要license授权， 生产环境只能单机使用
    # image: emqx/emqx-enterprise:5.10.0
    # 可使用5.9版本以前的开源版本，还不是BSL协议，然后自己搭建集群
    image: emqx:5.8.8
    user: "1000:1000"
    container_name: emqx1
    restart: always
    ports:
      - "11883:1883"
      - "18083:8083"
      - "18084:8084"
      - "18883:8883"
      - "19083:18083"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./emqx1/data:/opt/emqx/data
      - ./emqx1/log:/opt/emqx/log
    environment:
      - "EMQX_NODE_NAME=emqx@node1.emqx.com"
      - "EMQX_ADMIN_PASSWORD=${EMQX_PASS}"
      - "EMQX_CLUSTER__DISCOVERY_STRATEGY=static"
      - "EMQX_CLUSTER__STATIC__SEEDS=[emqx@node1.emqx.com, emqx@node2.emqx.com]"
      # 设置 Cookie 必须一致才能组成集群
      - "EMQX_NODE__COOKIE=emqx_cluster_secret_cookie"
    healthcheck:
      test: [ "CMD", "/opt/emqx/bin/emqx", "ctl", "status" ]
      interval: 5s
      timeout: 10s
      retries: 5
    networks:
      middleware-network:
        aliases:
          - node1.emqx.com
  emqx2:
    # 企业版需要license授权， 生产环境只能单机使用
    # image: emqx/emqx-enterprise:5.10.0
    # 可使用5.9版本以前的开源版本，还不是BSL协议，然后自己搭建集群
    image: emqx:5.8.8
    user: "1000:1000"
    container_name: emqx2
    restart: always
    ports:
      - "21883:1883"
      - "28083:8083"
      - "28084:8084"
      - "28883:8883"
      - "29083:18083"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./emqx2/data:/opt/emqx/data
      - ./emqx2/log:/opt/emqx/log
    environment:
      - "EMQX_NODE_NAME=emqx@node2.emqx.com"
      - "EMQX_ADMIN_PASSWORD=${EMQX_PASS}"
      - "EMQX_CLUSTER__DISCOVERY_STRATEGY=static"
      - "EMQX_CLUSTER__STATIC__SEEDS=[emqx@node1.emqx.com, emqx@node2.emqx.com]"
      # 设置 Cookie 必须一致才能组成集群
      - "EMQX_NODE__COOKIE=emqx_cluster_secret_cookie"
    healthcheck:
      test: [ "CMD", "/opt/emqx/bin/emqx", "ctl", "status" ]
      interval: 5s
      timeout: 10s
      retries: 5
    networks:
      middleware-network:
        aliases:
          - node2.emqx.com

