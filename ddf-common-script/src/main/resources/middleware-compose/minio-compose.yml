# MinIO 单机生产环境部署
# 使用说明：
# 1. 创建 .env 文件并配置环境变量
# 2. 创建目录: mkdir -p ./minio/{data,config,logs}
# 3. 启动: docker-compose up -d
# 4. 控制台访问: http://localhost:9001

networks:
  middleware-network:
    external: true  # 使用已创建的外部网络

services:
  minio:
    image: minio/minio:RELEASE.2024-12-13T22-19-12Z
    container_name: minio
    hostname: minio-server

    # 端口映射: API 9000, 控制台 9001
    ports:
      - "9000:9000"   # API 端口
      - "9001:9001"   # 控制台端口

    # 环境变量
    environment:
      # root 用户名（建议修改）
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      # root 密码（建议使用强密码，至少16位）
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-MinioPassword123456}
      # 区域配置
      MINIO_REGION: cn-bj1
      # 控制台静态文件路径
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
      # Prometheus 认证类型
      MINIO_PROMETHEUS_AUTH_TYPE: public

    # 命令行参数
    command: server /data --address :9000 --console-address :9001

    # 数据卷挂载（直接使用相对路径绑定）
    volumes:
      - ./minio/data:/data
      - ./minio/config:/root/.minio
      - ./minio/logs:/var/log/minio

    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s

    # 资源限制（生产环境建议配置）
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M

    # 重启策略
    restart: unless-stopped

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

    # ulimits 配置（生产环境建议）
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    # 停止优雅等待时间
    stop_grace_period: 60s
    networks:
      - middleware-network
