# Redis 6.0 自定义配置
# ---------------------------------------------------------------------------
# 仅保留与默认值不同的指令；其余指令 (端口、save 策略、appendfsync、AOF 命名等)
# 全部由 redis-server 的内置默认值接管。
# 默认 redis.conf 模板可在官方仓库查看：
#   https://raw.githubusercontent.com/redis/redis/6.0/redis.conf

# --- 网络与安全 ---
# 监听所有网络接口（容器内仍只通过 docker network 暴露给同网段服务）。
bind 0.0.0.0
# 关闭保护模式：因为已经显式监听 0.0.0.0 并设置了密码。
protected-mode no
# 访问密码（生产环境请改成 .env 注入或读取 secrets）。
requirepass ItIsSnowball

# --- 日志 ---
# 写入容器内 /data/redis.log，便于通过宿主机挂载查阅。
logfile "redis.log"

# --- 内存限制与淘汰策略 ---
# 与 docker compose deploy.resources.limits.memory 配合：容器 2.5G，Redis 占 2G。
maxmemory 2GB
# Redis不仅是缓存， 更多的日榜、周榜、月榜等都会绑定过期时间，但这只代表过了时间窗口后无效，并不代表可以被随意删除；还有限流时间窗口、倒计时业务等同样道理。
maxmemory-policy noeviction

# --- 持久化 ---
# 开启 AOF；fsync 策略保持默认 everysec。RDB 快照策略保持默认 (900/300/60)。
appendonly yes
appendfilename "appendonly.aof"

# If unsure, use "everysec".
# appendfsync always
appendfsync everysec
# appendfsync no

save 900 1
save 300 10
save 60 10000
