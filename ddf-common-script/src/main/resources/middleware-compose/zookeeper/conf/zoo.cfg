dataDir=/data
dataLogDir=/datalog
# TickTime: ZK 内部时间单位（毫秒）
tickTime=2000
# Session 失效时间 = tickTime * sessionTimeout
# 5个ticket, 客户端必须在initLimit * tickTime 连接上
initLimit=5
# 集群模式用，如果 Follower tickTime*syncLimit 秒 内没响应 Leader 的心跳，就会被 Leader 标记为掉线。
syncLimit=2
autopurge.snapRetainCount=3
autopurge.purgeInterval=0
maxClientCnxns=60
standaloneEnabled=true
admin.enableServer=true
clientPort=2181
#server.1=localhost:2888:3888
#server.2=ip2:2888:3888
