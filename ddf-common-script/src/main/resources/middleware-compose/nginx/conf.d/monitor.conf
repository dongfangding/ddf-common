map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream grafana_upstream {
    server grafana:3000;
}

# nginx 在 upstream 上下文里的 server 指令只接受 `host[:port]`，
# 写成 `http://prometheus:9090` 会让 nginx 启动时直接报 host not found，
# proxy_pass 那行 (http://prometheus_upstream/) 才负责拼协议。
upstream prometheus_upstream {
    server prometheus:9090;
}

server {
    listen 80;
    server_name monitor.snowball.local;

    client_max_body_size 20m;

    location / {
        proxy_pass http://grafana_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /prometheus/ {
        proxy_pass http://prometheus_upstream/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
